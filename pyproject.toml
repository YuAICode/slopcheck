[project]
name = "slopcheck"
version = "0.1.0"
description = "AI-aware code review: catch hallucinations in AI-generated diffs using a code knowledge graph."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slopcheck = "slopcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopcheck"]

[dependency-groups]
dev = ["pytest>=8"]

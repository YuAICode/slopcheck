name: slopcheck

# Dogfood：slopcheck 用它自己审自己的 PR（也是一份活示例）
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./
        with:
          strict: "false"
